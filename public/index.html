<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Máy tính ký gửi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Máy tính ký gửi</h1>
    <p class="sub">Chia tiền đơn hàng: chọn tỷ lệ nhãn hàng, phần còn lại thuộc cửa hàng.</p>
    <label for="share">Tỷ lệ nhãn hàng</label>
    <select id="share">
      <option value="75" selected>75%</option>
      <option value="70">70%</option>
    </select>
    <label for="amount">Số tiền đơn hàng (đồng)</label>
    <input id="amount" type="text" inputmode="numeric" autocomplete="off" placeholder="Ví dụ: 400000">
    <p id="hint" class="hint" role="alert" hidden></p>
    <dl id="result" class="result" hidden>
      <div><dt id="brand">Nhãn hàng nhận: </dt></div>
      <div><dt id="store">Cửa hàng giữ: </dt></div>
    </dl>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
